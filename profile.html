<!doctype html><html lang="en"><head>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#071a3d"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a3d"><title>Thomduck — Profile</title><link rel="icon" href="icon-2.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#071a3d;--card:#1c1710;--border:#4a3c24;--gold:#d9ad35;--text:#ffffff;--muted:#dce6f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:DM Sans,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:center;gap:14px;margin:8px 0 28px}.back{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;color:var(--gold);text-decoration:none;font-size:30px}.top h1{font:700 2rem 'Playfair Display',serif;margin:0}.card{background:linear-gradient(145deg,#272016,#19140d);border:1px solid rgba(232,197,71,.32);border-radius:24px;padding:24px;margin-bottom:16px}.title{font:700 1.6rem 'Playfair Display',serif;margin:0 0 16px}.info{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid rgba(232,197,71,.12)}.info:last-child{border-bottom:0}.label{color:var(--muted)}.value{font-weight:700;word-break:break-word}.code{font:700 1.7rem 'Playfair Display',serif;color:var(--gold);letter-spacing:2px}.btn{width:100%;min-height:52px;border-radius:15px;border:1px solid var(--gold);background:linear-gradient(180deg,#ffc936,#e9ad1f);color:#171207;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:12px;cursor:pointer}.btn.outline{background:transparent;color:var(--gold)}@media(max-width:520px){.info{grid-template-columns:1fr}.wrap{padding-left:14px;padding-right:14px}}</style><link rel="stylesheet" href="premium.css">
<style id="thomduck-navy-gold-theme">
:root{--td-navy:#071a3d;--td-navy2:#0b2452;--td-gold:#d9ad35;--td-gold2:#ffc936;--td-white:#fff;--navy:#071a3d;--gold:#d9ad35;--royal:#102a55;--bg:#071a3d;--background:#071a3d;--card:#0b2452;--surface:#0b2452;--text:#fff;--muted:#dce6f7;--border:rgba(217,173,53,.42)}
html{background:#071a3d!important;color-scheme:dark} body{background-color:#071a3d!important;color:#fff!important} body,main,section,article,header,footer,aside,.container,.content,.page,.dashboard,.main-content{color:#fff} 
/* Keep photographs and hero artwork, but recolor UI surfaces consistently. */
:where(.card,.panel,.box,.modal,.popup,.product-card,.stat-card,.balance-card,.form-card,.auth-card,.dashboard-card,.community-card,.activity-popup,.quick-nav,.sidebar,.side-nav,.nav-menu,.menu-panel){background-color:#0b2452!important;color:#fff!important;border-color:rgba(217,173,53,.48)!important}
:where(h1,h2,h3,h4,h5,h6,label,strong,.title,.brand,.logo-text){color:#fff} :where(p,small,.muted,.subtitle,.description,.text-muted){color:#dce6f7}
:where(button,.btn,[role=button],input[type=submit],input[type=button],.primary-btn,.cta,.action-btn){border-color:#d9ad35!important}
:where(button,.btn,input[type=submit],input[type=button],.primary-btn,.cta,.action-btn){background-color:#d9ad35!important;color:#071a3d!important;font-weight:800}
:where(a,.link){color:#ffc936} :where(input,select,textarea){background:#fff!important;color:#071a3d!important;border-color:#d9ad35!important} :where(input,select,textarea)::placeholder{color:#65718a!important}
:where(.nav-icon,.nav-item,.quick-nav a,.sidebar a,.side-nav a,.nav-menu a){border-color:rgba(217,173,53,.5)!important} :where(.badge,.tag,.pill,.product-badge){background:#d9ad35!important;color:#071a3d!important}
/* Main landing page sections */
.hero,.hero-section,.banner,.welcome-section{color:#fff} .hero :where(h1,h2,p),.hero-section :where(h1,h2,p){color:#fff!important}
/* Mobile-safe controls */
button,a,input,select,textarea{accent-color:#d9ad35} ::selection{background:#d9ad35;color:#071a3d}
</style>

<script defer src="./app.js"></script></head><body><main class="wrap"><div class="top"><a class="back" href="dashboard.html">‹</a><h1>Profile</h1></div><section class="card"><h2 class="title">Customer Profile</h2><div class="info"><span class="label">Name</span><span class="value" id="full">—</span></div><div class="info"><span class="label">Email address</span><span class="value" id="email">—</span></div><div class="info"><span class="label">Date joined</span><span class="value" id="joined">—</span></div><div class="info"><span class="label">Status</span><span class="value" id="status">Active</span></div><div class="info"><span class="label">Customer ID</span><span class="value" id="id">—</span></div></section><section class="card"><h2 class="title">Referral</h2><div class="info"><span class="label">Unique referral code</span><span class="value code" id="ref">—</span></div><button class="btn" id="copy">Copy Referral Code</button></section><section class="card"><h2 class="title">Referral Link</h2><div class="info"><span class="label">Your referral link</span><input class="value" id="refLink" readonly value="—" onclick="this.select()" style="width:100%;background:transparent;border:1px solid rgba(232,197,71,.22);border-radius:10px;padding:12px;color:var(--gold);font-size:.88rem;line-height:1.5;cursor:text"></div><button class="btn" id="copyLink">Copy Referral Link</button><button class="btn outline" id="shareLink">Share Referral Link</button><div id="linkMsg" style="text-align:center;color:var(--gold);font-size:.85rem;margin-top:10px;display:none"></div></section><section class="card"><h2 class="title">Bank Details</h2><div class="info"><span class="label">Bank name</span><span class="value" id="bank">Not set</span></div><div class="info"><span class="label">Account number</span><span class="value" id="acct">Not set</span></div><div class="info"><span class="label">Account name</span><span class="value" id="holder">Not set</span></div></section><a class="btn" href="add-bank.html">Add / Update Bank Account</a><a class="btn outline" href="dashboard.html">Return to Dashboard</a><button class="btn outline" onclick="clearLoggedUser();location.replace('login.html')">Logout</button></main><script src="app.js"></script><script>let u=getLoggedUser();if(!u){location.replace('login.html')}else{document.getElementById('full').textContent=u.fullName||'—';document.getElementById('email').textContent=u.email||'—';document.getElementById('joined').textContent=u.joined?new Date(u.joined).toLocaleDateString():'—';document.getElementById('status').textContent=u.status||'Active';document.getElementById('id').textContent=u.id||'—';document.getElementById('ref').textContent=u.referralCode||'—';var wa=u.withdrawalAccount||{};document.getElementById('bank').textContent=u.bankName||wa.bankName||'Not set';document.getElementById('acct').textContent=u.bankAccount||wa.accountNumber||'Not set';document.getElementById('holder').textContent=u.bankHolder||wa.accountName||u.fullName||'Not set'}document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('ref').textContent).then(()=>alert('Referral code copied')).catch(()=>{});
tdRequest('/auth/me').then(r=>{u=r.user;setLoggedUser(u);['full','email','status','id','ref'].forEach((id)=>{const el=document.getElementById(id);const key={full:'fullName',email:'email',status:'status',id:'id',ref:'referralCode'}[id];if(el)el.textContent=u[key]||'—'});document.getElementById('joined').textContent=u.joined?new Date(u.joined).toLocaleDateString():'—';const wa=u.withdrawalAccount||{};document.getElementById('bank').textContent=u.bankName||wa.bankName||'Not set';document.getElementById('acct').textContent=u.bankAccount||wa.accountNumber||'Not set';document.getElementById('holder').textContent=u.bankHolder||wa.accountName||u.fullName||'Not set';}).catch(()=>{clearLoggedUser();location.replace('login.html')});
const referralCode=(u&&u.referralCode)||'';
const referralLink=location.origin+'/signup.html?ref='+encodeURIComponent(referralCode);
const linkEl=document.getElementById('refLink');
const linkMsg=document.getElementById('linkMsg');
if(linkEl) linkEl.value=referralLink;
function copiedLinkMessage(text){
  if(!linkMsg)return;
  linkMsg.textContent=text;
  linkMsg.style.display='block';
  setTimeout(()=>linkMsg.style.display='none',2200);
}
document.getElementById('copyLink').onclick=()=>{
  navigator.clipboard.writeText(referralLink).then(()=>copiedLinkMessage('Referral link copied')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=referralLink;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copiedLinkMessage('Referral link copied');
  });
};
document.getElementById('shareLink').onclick=async()=>{
  if(navigator.share){
    try{await navigator.share({title:'Thomduck',text:'Join Thomduck using my referral link:',url:referralLink});}catch(e){}
  }else{
    navigator.clipboard.writeText(referralLink).then(()=>copiedLinkMessage('Referral link copied — ready to share')).catch(()=>{});
  }
};</script></body></html>
