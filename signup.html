<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#d4a536" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thomduck" />
  <title>Thomduck – Create Account</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-2.png" />
  <link rel="apple-touch-icon" href="icon-1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: 40 20% 8%; --foreground: 43 80% 85%; --card: 40 18% 12%;
      --primary: 43 90% 55%; --muted-foreground: 40 20% 55%; --border: 43 30% 25%;
      --input: 43 20% 20%; --radius: 0.75rem;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background-color: hsl(var(--background)); color: hsl(var(--foreground));
      font-family: "DM Sans", sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    h1 { font-family: "Playfair Display", serif; }
    .container { width: 100%; max-width: 420px; text-align: center; }
    .logo { font-size: 2.4rem; font-weight: 700; color: #d9ad35; margin-bottom: 8px; }
    .subtitle { color: hsl(var(--muted-foreground)); font-size: 0.95rem; margin-bottom: 32px; }
    .card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 28px 24px; text-align: left; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    input {
      width: 100%; height: 44px; background: hsl(var(--input)); border: 1px solid hsl(var(--border));
      border-radius: 8px; padding: 0 14px; color: hsl(var(--foreground)); font-size: 0.95rem; outline: none;
    }
    input:focus { border-color: hsl(var(--primary)); }
    input::placeholder { color: hsl(var(--muted-foreground)); }
    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 1.1rem; padding: 4px;
    }
    .btn-primary {
      width: 100%; height: 48px; background: #d9ad35; color: #1a1408; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-primary:hover { background: #f0d060; }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
    .footer-text { text-align: center; margin-top: 20px; font-size: 0.9rem; color: hsl(var(--muted-foreground)); }
    .footer-text a { color: #d9ad35; text-decoration: none; font-weight: 500; }
    .msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; display: none; }
    .msg.success { background: rgba(39,174,96,0.15); color: #2ecc71; display: block; }
    .msg.error { background: rgba(231,76,60,0.15); color: #e74c3c; display: block; }

    .install-banner {
      position: fixed; bottom: 0; left: 0; right: 0; background: hsl(var(--card));
      border-top: 1px solid hsl(var(--border)); padding: 16px 18px; display: none; z-index: 300;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.45);
    }
    .install-banner.show { display: block; }
    .install-inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .install-icon {
      width: 48px; height: 48px; background: #d9ad35; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #1a1408; flex-shrink: 0;
    }
    .install-text { flex: 1; text-align: left; }
    .install-text strong { display: block; font-size: 1rem; margin-bottom: 2px; }
    .install-text span { font-size: 0.82rem; color: hsl(var(--muted-foreground)); }
    .install-actions { display: flex; flex-direction: column; gap: 6px; }
    .btn-install { background: #d9ad35; color: #1a1408; border: none; border-radius: 8px; height: 38px; padding: 0 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-later { background: transparent; border: 1px solid hsl(var(--border)); color: hsl(var(--foreground)); border-radius: 8px; height: 32px; padding: 0 12px; font-size: 0.8rem; cursor: pointer; }
    .ios-instructions { display: none; margin-top: 12px; padding: 12px 14px; background: hsl(var(--background)); border-radius: 10px; font-size: 0.85rem; color: hsl(var(--muted-foreground)); text-align: left; }
    .ios-instructions.show { display: block; }
    .ios-instructions ol { margin: 8px 0 0 18px; }
    .ios-instructions .share-icon { display: inline-block; background: #d9ad35; color: #1a1408; padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; }
  </style>
<link rel="stylesheet" href="premium.css">
<style id="thomduck-navy-gold-theme">
:root{--td-navy:#071a3d;--td-navy2:#0b2452;--td-gold:#d9ad35;--td-gold2:#ffc936;--td-white:#fff;--navy:#071a3d;--gold:#d9ad35;--royal:#102a55;--bg:#071a3d;--background:#071a3d;--card:#0b2452;--surface:#0b2452;--text:#fff;--muted:#dce6f7;--border:rgba(217,173,53,.42)}
html{background:#071a3d!important;color-scheme:dark} body{background-color:#071a3d!important;color:#fff!important} body,main,section,article,header,footer,aside,.container,.content,.page,.dashboard,.main-content{color:#fff} 
/* Keep photographs and hero artwork, but recolor UI surfaces consistently. */
:where(.card,.panel,.box,.modal,.popup,.product-card,.stat-card,.balance-card,.form-card,.auth-card,.dashboard-card,.community-card,.activity-popup,.quick-nav,.sidebar,.side-nav,.nav-menu,.menu-panel){background-color:#0b2452!important;color:#fff!important;border-color:rgba(217,173,53,.48)!important}
:where(h1,h2,h3,h4,h5,h6,label,strong,.title,.brand,.logo-text){color:#fff} :where(p,small,.muted,.subtitle,.description,.text-muted){color:#dce6f7}
:where(button,.btn,[role=button],input[type=submit],input[type=button],.primary-btn,.cta,.action-btn){border-color:#d9ad35!important}
:where(button,.btn,input[type=submit],input[type=button],.primary-btn,.cta,.action-btn){background-color:#d9ad35!important;color:#071a3d!important;font-weight:800}
:where(a,.link){color:#ffc936} :where(input,select,textarea){background:#fff!important;color:#071a3d!important;border-color:#d9ad35!important} :where(input,select,textarea)::placeholder{color:#65718a!important}
:where(.nav-icon,.nav-item,.quick-nav a,.sidebar a,.side-nav a,.nav-menu a){border-color:rgba(217,173,53,.5)!important} :where(.badge,.tag,.pill,.product-badge){background:#d9ad35!important;color:#071a3d!important}
/* Main landing page sections */
.hero,.hero-section,.banner,.welcome-section{color:#fff} .hero :where(h1,h2,p),.hero-section :where(h1,h2,p){color:#fff!important}
/* Mobile-safe controls */
button,a,input,select,textarea{accent-color:#d9ad35} ::selection{background:#d9ad35;color:#071a3d}
</style>

<script defer src="./app.js"></script></head>
<body>
  <div class="container">
    <h1 class="logo">Thomduck</h1>
    <p class="subtitle">Create your account and start earning</p>
    <div class="card">
      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required />
            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>Referral Code <span style="opacity:0.6">(optional)</span></label>
          <input type="text" id="referral" value="" />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
        <div class="msg" id="msg"></div>
      </form>
      <p class="footer-text">Already have an account? <a href="login.html">Sign In</a></p>
    </div>
  </div>

  <div class="install-banner" id="installBanner">
    <div class="install-inner">
      <div class="install-icon">↓</div>
      <div class="install-text">
        <strong>Install Thomduck</strong>
        <span id="installHint">Add to home screen for quick access</span>
      </div>
      <div class="install-actions">
        <button class="btn-install" id="installBtn">Install</button>
        <button class="btn-later" onclick="hideInstallBanner()">Later</button>
      </div>
    </div>
    <div class="ios-instructions" id="iosInstructions">
      <strong style="color:#d9ad35">How to install on iPhone:</strong>
      <ol>
        <li>Tap the <span class="share-icon">Share</span> button in Safari</li>
        <li>Tap <strong>Add to Home Screen</strong></li>
        <li>Tap <strong>Add</strong></li>
      </ol>
    </div>
  </div>

  <div id="premiumLoader" class="premium-loader"><div class="loader-orbit"></div><div class="loader-logo">TD</div><div class="loader-title">Thomduck</div><div class="loader-sub">Creating your premium account</div><div class="loader-bar"><i id="loaderBar"></i></div><div class="loader-time" id="loaderTime">0%</div></div><style>.premium-loader{position:fixed;inset:0;z-index:9999;display:none;place-items:center;align-content:center;gap:10px;background:radial-gradient(circle at center,#102d63,#071a3d 55%,#030a19);text-align:center}.premium-loader.show{display:grid}.loader-orbit{position:absolute;width:210px;height:210px;border:1px solid rgba(232,197,71,.2);border-top-color:#d9ad35;border-radius:50%;animation:spin 1s linear infinite}.loader-logo{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff,#d9ad35,#b88b20);color:#171006;font:800 2rem 'Playfair Display',serif;box-shadow:0 0 40px rgba(232,197,71,.28)}.loader-title{font:700 1.6rem 'Playfair Display',serif;color:#d9ad35}.loader-sub,.loader-time{color:#dce6f7;font-size:.82rem}.loader-bar{width:220px;height:5px;background:#284779;border-radius:99px;overflow:hidden;margin-top:5px}.loader-bar i{display:block;width:0;height:100%;background:#d9ad35;transition:width .1s linear}</style><script src="app.js"></script><script>
if(getLoggedUser()) location.href='dashboard.html';setupInstallBanner();
function premiumThen(url){const l=document.getElementById('premiumLoader'),bar=document.getElementById('loaderBar'),pct=document.getElementById('loaderTime');l.classList.add('show');let s=0;const t=setInterval(()=>{s++;bar.style.width=(s/5*100)+'%';pct.textContent=Math.min(100,Math.round(s/5*100))+'%';if(s>=5){clearInterval(t);location.href=url}},100)}
const urlParams=new URLSearchParams(location.search);
const urlRef=urlParams.get('ref')||urlParams.get('referral')||'';
if(urlRef){
  document.getElementById('referral').value=urlRef.trim();
  document.getElementById('referral').readOnly=true;
  document.getElementById('referral').style.opacity='0.85';
}
document.getElementById('signupForm').addEventListener('submit',async function(e){e.preventDefault();const fullName=document.getElementById('fullName').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value,referralCode=document.getElementById('referral').value.trim(),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');msg.className='msg';msg.style.display='none';if(password!==confirm){msg.className='msg error';msg.textContent='Passwords do not match';return}if(password.length<8){msg.className='msg error';msg.textContent='Password must be at least 8 characters';return}btn.disabled=true;btn.textContent='Creating account...';try{const data=await tdRequest('/auth/signup',{method:'POST',body:JSON.stringify({fullName,email,password,referralCode})});setLoggedUser(data.user);premiumThen('dashboard.html')}catch(err){msg.className='msg error';msg.style.display='block';msg.textContent=err.message||'Could not create account';btn.disabled=false;btn.textContent='Create Account'}});</script></body></html>
